name: Comprobar

concurrency:
  group: comprobar-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      # GitHub a veces no descarga un complemento: se reintenta antes de dar error.
      - run: |
          for i in 1 2 3; do flutter build apk --debug && break; [ $i = 3 ] && exit 1; echo "Reintento $i"; sleep 20; done
